# 4-bit NF4 checkpoints that fit a 15 GB Colab T4.
# Inference defaults apply to every zero-shot and LoRA eval run.
inference:
  max_seq_length: 3072
  temperature: 0.0
  max_new_tokens: 384

models:
  qwen2.5-7b:
    repo_id: unsloth/Qwen2.5-7B-Instruct-bnb-4bit
    adapter: qwen
    load_in_4bit: true
    approx_vram_gb: 5.5
    max_seq_length: 3072
    enable_thinking: false
    prefill_empty_think: false
    notes: Fast baseline. Native Hermes tool calls. No thinking overhead.

  qwen2.5-14b:
    repo_id: unsloth/Qwen2.5-14B-Instruct-bnb-4bit
    adapter: qwen
    load_in_4bit: true
    approx_vram_gb: 9.5
    max_seq_length: 3072
    enable_thinking: false
    prefill_empty_think: false
    notes: Highest Vietnamese accuracy. Fits a T4 at max_seq_length 3072.

  qwen3-8b:
    repo_id: unsloth/Qwen3-8B-unsloth-bnb-4bit
    adapter: qwen
    load_in_4bit: true
    approx_vram_gb: 6.0
    max_seq_length: 3072
    enable_thinking: false
    prefill_empty_think: true
    notes: Must pass enable_thinking=False so the model does not emit a think block.

  gemma2-9b:
    repo_id: unsloth/gemma-2-9b-it-bnb-4bit
    adapter: gemma
    load_in_4bit: true
    approx_vram_gb: 6.5
    max_seq_length: 3072
    enable_thinking: false
    prefill_empty_think: false
    notes: Strong Vietnamese instruction following. JSON tool wrapper.

  gemma3-12b:
    repo_id: unsloth/gemma-3-12b-it-unsloth-bnb-4bit
    adapter: gemma
    load_in_4bit: true
    approx_vram_gb: 8.5
    max_seq_length: 3072
    enable_thinking: false
    prefill_empty_think: false
    notes: Gemma 3 text checkpoint. Structured JSON tool calls.
